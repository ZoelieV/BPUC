<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Match</title>
</head>
<body>
<a href="index.html">Accueil</a>
<h1>Match</h1>
 
  <p id="room-id"></p>
<p id="player-id"></p>
<p id="lien-room"></p>
 
  <script>
    async function initialiserMatch() {
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get("room");
      let player = params.get("player");
 
      if (!roomId) {
        document.body.innerHTML += "<p>Room introuvable.</p>";
        return;
      }
 
      if (!player) {
        const reponse = await fetch(`/api/rooms/${roomId}/join`);
        const data = await reponse.json();
 
        if (!data.ok) {
          document.body.innerHTML += "<p>Impossible de rejoindre la room.</p>";
          return;
        }
 
        player = data.player;
        window.history.replaceState({}, "", `match.html?room=${roomId}&player=${player}`);
      }
 
      document.getElementById("room-id").textContent = "Room : " + roomId;
      document.getElementById("player-id").textContent = "Vous êtes : " + player;
      document.getElementById("lien-room").innerHTML =
        `Lien à partager : <a href="match.html?room=${roomId}">match.html?room=${roomId}</a>`;
    }
 
    initialiserMatch();
</script>
</body>
</html>
