<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tous les comptes</title>
<link rel="stylesheet" href="all_accounts.css">
</head>
<body>
<a href="../index.html" class="lien-accueil">Accueil</a>
<h1>Liste des comptes</h1>

  <div id="accounts-list"></div>

  <div id="modal">
    <div id="modal-content">
      <div id="modal-header">
        <h2 id="modal-title">Profil</h2>
        <button id="close-modal" type="button">×</button>
      </div>

      <div id="view-selector">
        <button type="button" class="view-btn active" data-view="characters">Personnages</button>
        <button type="button" class="view-btn" data-view="weapons">Armes</button>
      </div>

      <div id="box-selector">
        <button type="button" class="box-btn active" data-box="full">Full box</button>
        <button type="button" class="box-btn" data-box="stuff">Stuff</button>
      </div>

      <div id="type-sort-bar"></div>

      <div id="sort-bar">
        <button type="button" class="sort-btn" data-sort="rarete">Rareté <span class="fleche"></span></button>
        <button type="button" class="sort-btn" data-sort="points">Points <span class="fleche"></span></button>
        <button type="button" class="sort-btn" data-sort="constellation">Constellation <span class="fleche"></span></button>
      </div>

      <div id="profile-box"></div>
    </div>
  </div>

  <script src="all_accounts.js"></script>
</body>
</html>
